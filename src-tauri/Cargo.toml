[package]
name = "creator-suite-launcher"
version = "0.1.0"
description = "Creative Creator Studio launcher - install, open and follow the suite's free apps"
authors = ["Squeeze contributors"]
license = "GPL-3.0-or-later"
edition = "2021"

# Own workspace so the launcher builds independently of the app crates.
[workspace]

[lib]
name = "launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
